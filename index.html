<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figuras Musicales Interactivas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7f7f7;
      margin: 0;
      padding: 25px;
      color: #222;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 25px;
    }

    .figura {
      background: white;
      max-width: 420px;
      margin: 15px auto;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .simbolo {
      font-size: 65px;
      margin: 5px;
    }

    button {
      font-size: 18px;
      padding: 14px 25px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      background: #222;
      color: white;
      width: 90%;
      max-width: 300px;
    }

    button:active {
      transform: scale(.97);
    }

    .tiempo {
      font-size: 16px;
      color: #555;
      margin-bottom: 15px;
    }

    footer {
      margin-top: 35px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<h1>🎵 Figuras Musicales</h1>

<p class="subtitulo">
Escucha cómo cambia la duración de cada figura<br>
Tempo: 80 BPM
</p>


<div class="figura" id="redonda">
  <div class="simbolo">𝅝</div>
  <h2>Redonda</h2>
  <div class="tiempo">4 tiempos</div>
  <button onclick="tocar(4)">▶ Escuchar redonda</button>
</div>


<div class="figura" id="blanca">
  <div class="simbolo">𝅗𝅥</div>
  <h2>Blanca</h2>
  <div class="tiempo">2 tiempos</div>
  <button onclick="tocar(2)">▶ Escuchar blanca</button>
</div>


<div class="figura" id="negra">
  <div class="simbolo">♩</div>
  <h2>Negra</h2>
  <div class="tiempo">1 tiempo</div>
  <button onclick="tocar(1)">▶ Escuchar negra</button>
</div>


<div class="figura" id="corchea">
  <div class="simbolo">♪</div>
  <h2>Corchea</h2>
  <div class="tiempo">½ tiempo</div>
  <button onclick="tocar(0.5)">▶ Escuchar corchea</button>
</div>


<div class="figura" id="semicorchea">
  <div class="simbolo">♬</div>
  <h2>Semicorchea</h2>
  <div class="tiempo">¼ de tiempo</div>
  <button onclick="tocar(0.25)">▶ Escuchar semicorchea</button>
</div>


<div class="figura" id="fusa">
  <div class="simbolo">♬</div>
  <h2>Fusa</h2>
  <div class="tiempo">⅛ de tiempo</div>
  <button onclick="tocar(0.125)">▶ Escuchar fusa</button>
</div>


<footer>
Proyecto interactivo de figuras musicales
</footer>


<script>

let contexto;

function tocar(tiempos) {

  if (!contexto) {
    contexto = new (window.AudioContext ||
                    window.webkitAudioContext)();
  }

  const bpm = 80;

  // duración de un tiempo
  const beat = 60 / bpm;

  const duracion = beat * tiempos;

  let inicio = contexto.currentTime + 0.05;

  /*
    Repetimos el sonido 8 veces
    dejando una pequeña separación
    para distinguir cada figura.
  */

  for (let i = 0; i < 8; i++) {

    let osc = contexto.createOscillator();
    let gain = contexto.createGain();

    osc.type = "sine";
    osc.frequency.value = 440;

    osc.connect(gain);
    gain.connect(contexto.destination);

    let comienzo = inicio + i * (duracion + 0.18);
    let final = comienzo + duracion;

    gain.gain.setValueAtTime(0, comienzo);
    gain.gain.linearRampToValueAtTime(0.30, comienzo + 0.02);

    gain.gain.setValueAtTime(0.30, final - 0.04);
    gain.gain.linearRampToValueAtTime(0, final);

    osc.start(comienzo);
    osc.stop(final + 0.05);
  }
}

</script>

</body>
</html>
